name: ${COMPOSE_PROJECT_NAME:-wechat-layout}

x-node-app: &node-app
  image: wechat-layout-node-dev:local
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - application

x-application-environment: &application-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - application

  redis:
    image: redis:8.2.8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - application

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - application

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        printf 'S0-ARCH-002 MinIO upload probe\n' | mc pipe "local/$$MINIO_BUCKET/healthcheck.txt"
        mc stat "local/$$MINIO_BUCKET/healthcheck.txt"
    security_opt:
      - no-new-privileges:true
    networks:
      - application

  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - application

  web:
    <<: *node-app
    command:
      [
        "pnpm",
        "--filter",
        "@wechat-layout/web",
        "exec",
        "next",
        "dev",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    environment:
      <<: *application-environment
      WEB_PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    <<: *node-app
    build:
      context: ../..
      dockerfile: infrastructure/docker/node-app.Dockerfile
      target: workspace
    command: ["pnpm", "--filter", "@wechat-layout/api", "dev"]
    environment:
      <<: *application-environment
      API_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('node:net');const socket=net.connect(3001,'127.0.0.1');socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  worker:
    <<: *node-app
    command: ["pnpm", "--filter", "@wechat-layout/worker", "dev"]
    environment:
      <<: *application-environment
      WORKER_CONCURRENCY: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('node:fs');const own=new Set([String(process.pid),String(process.ppid)]);const found=fs.readdirSync('/proc').filter((name)=>name!==''&&Number.isInteger(Number(name))&&!own.has(name)).some((name)=>{try{return fs.readFileSync('/proc/'+name+'/cmdline','utf8').includes('src/main.ts')}catch{return false}});process.exit(found?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  scheduler:
    <<: *node-app
    command: ["pnpm", "--filter", "@wechat-layout/scheduler", "dev"]
    environment:
      <<: *application-environment
      SCHEDULER_INTERVAL_SECONDS: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('node:fs');const own=new Set([String(process.pid),String(process.ppid)]);const found=fs.readdirSync('/proc').filter((name)=>name!==''&&Number.isInteger(Number(name))&&!own.has(name)).some((name)=>{try{return fs.readFileSync('/proc/'+name+'/cmdline','utf8').includes('src/main.ts')}catch{return false}});process.exit(found?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:

networks:
  application:
    driver: bridge
