services:
  nginx:
    profiles:
      - container-edge

  web:
    cpus: "0.50"
    mem_limit: 768m
    ports:
      - "127.0.0.1:${HOST_WEB_PORT:-3100}:3000"

  api:
    cpus: "0.75"
    mem_limit: 768m
    ports:
      - "127.0.0.1:${HOST_API_PORT:-3101}:3001"
    extra_hosts:
      - "assets.ericmm.com:host-gateway"

  worker:
    cpus: "0.75"
    mem_limit: 896m
    pids_limit: 256
    extra_hosts:
      - "assets.ericmm.com:host-gateway"

  webpage-browser:
    cpus: "0.75"
    mem_limit: 896m
    pids_limit: 256
    tmpfs:
      - /tmp:size=128m,mode=1777

  scheduler:
    cpus: "0.25"
    mem_limit: 256m
    extra_hosts:
      - "assets.ericmm.com:host-gateway"

  database-migrate:
    cpus: "0.50"
    mem_limit: 512m
    extra_hosts:
      - "assets.ericmm.com:host-gateway"

  postgres:
    cpus: "0.50"
    mem_limit: 640m
    shm_size: 64m

  redis:
    cpus: "0.25"
    mem_limit: 256m
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    cpus: "0.25"
    mem_limit: 384m
    pids_limit: 128
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${HOST_MINIO_PORT:-3190}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - storage

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles:
      - storage-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      APP_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      BACKUP_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$APP_BUCKET"
        mc mb --ignore-existing "local/$$BACKUP_BUCKET"
        mc anonymous set none "local/$$APP_BUCKET"
        mc anonymous set none "local/$$BACKUP_BUCKET"
        printf 'host-lean object storage probe\n' | mc pipe "local/$$APP_BUCKET/healthcheck.txt"
        mc stat "local/$$APP_BUCKET/healthcheck.txt"
    security_opt:
      - no-new-privileges:true
    networks:
      - storage

  prometheus:
    profiles:
      - observability

  alertmanager:
    profiles:
      - observability

  grafana:
    profiles:
      - observability

  loki:
    profiles:
      - observability

  tempo:
    profiles:
      - observability

  otel-collector:
    profiles:
      - observability

  node-exporter:
    profiles:
      - observability

volumes:
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-wechat-layout-production}-minio-data

networks:
  storage:
    driver: bridge
    internal: true
