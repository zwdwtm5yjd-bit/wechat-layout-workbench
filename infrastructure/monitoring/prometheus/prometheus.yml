global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics-bearer-token
    static_configs:
      - targets: [api:3001]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
