<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="原创动态视觉素材 010">
  <style>.motion{animation:breathe 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes breathe{0%,100%{transform:none;opacity:1}50%{opacity:.55;transform:scale(.92)}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}</style>
  <defs>
    <linearGradient id="g20" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8fb8a3"/><stop offset="1" stop-color="#365c54"/></linearGradient>
    <linearGradient id="fade20" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8fb8a3" stop-opacity="0"/><stop offset=".5" stop-color="#8fb8a3" stop-opacity=".65"/><stop offset="1" stop-color="#8fb8a3" stop-opacity="0"/></linearGradient>
    <pattern id="dots20" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#365c54" opacity=".16"/></pattern>
