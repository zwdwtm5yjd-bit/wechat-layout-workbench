[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-layout-docx-worker"
version = "0.1.0"
description = "Safe DOCX parser and import worker for the WeChat layout workbench"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
docx-worker = "docx_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
